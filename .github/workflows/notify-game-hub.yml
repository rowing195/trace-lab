name: Notify game-hub

on:
  push:
    branches: ["main"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch submodule-updated to game-hub
        env:
          GH_TOKEN: ${{ secrets.GAME_HUB_DISPATCH_TOKEN }}
        run: |
          gh api repos/rowing195/game-hub/dispatches \
            -f event_type=submodule-updated \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[sha]=${{ github.sha }}"
